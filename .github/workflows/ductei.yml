name: DUCTEI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ claude/turbonet-strip-offensive-98x8tb ]

jobs:
  ductei:
    name: DUCTEI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install GUI system dependencies (GTK for eframe/rfd)
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run TurboNet Core tests (post-quantum/transport)
        run: cargo test -p turbonet-core
